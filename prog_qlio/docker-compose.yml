version: "3.9"

services:
  # 1. La Base de données (On la garde !)
  mysql:
    image: mysql:8.0
    container_name: python_project_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: python_auth_db  # J'ai changé le nom de la base
    ports:
      # TRÈS IMPORTANT : Ton Python se connectera sur le port 3307
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. L'interface de gestion (On la garde pour t'aider)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: python_project_pma
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  db_data: